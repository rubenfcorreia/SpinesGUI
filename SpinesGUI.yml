# Modernized runtime for NumPy 2 / Suite2p v1 compatibility.
# The previous file was a frozen Python 3.9 export; this is a solver-friendly spec.
name: spinesGUI
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - numpy=2.4.6
  - scipy
  - pandas
  - matplotlib
  - ipympl
  - ipywidgets
  - ipykernel
  - jupyterlab
  - pillow
  - psutil
  - pyyaml
  - pyqt=5.15
  - numba
  - llvmlite
  - h5py
  - scikit-image
  - scikit-learn
  - tifffile
  - threadpoolctl
  - tqdm
  - joblib
  - pip
  - pip:
      - suite2p==1.1.0
      - cellpose==4.2.1.1
      - opencv-python-headless==4.13.0.92
      - pynwb==4.0.0
      - pyqtgraph==0.14.0
      - roifile==2026.2.10
      - scanimage-tiff-reader==1.4.1.4
